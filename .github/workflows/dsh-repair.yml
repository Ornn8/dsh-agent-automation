name: DSH Review Repair

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull_request_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      request_id:
        required: false
        type: string
        default: ''
      controller_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: Target owner/repository
        required: true
        type: string
      pull_request_number:
        description: Target pull request number
        required: true
        type: number
      head_sha:
        description: Exact target pull request head
        required: true
        type: string
      request_id:
        description: Trusted GitHub request id
        required: true
        type: string
      controller_sha:
        description: Immutable controller revision
        required: true
        type: string

concurrency:
  group: dsh-repair-${{ inputs.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  repair:
    name: dsh/review-repair
    runs-on: [self-hosted, Windows, X64, dsh-agent]
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Validate immutable controller revision
        env:
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if ($env:CONTROLLER_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'controller_sha must be a full commit SHA'
          }

      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: ${{ inputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Address Codex review with DSH
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPAIR_REQUEST_ID: ${{ inputs.request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node controller/src/dsh-repair.mjs
