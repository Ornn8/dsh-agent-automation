name: DSH Review Repair

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      request_id:
        required: false
        type: string
        default: ''
      ci_workflow_name:
        required: false
        type: string
        default: ''
concurrency:
  group: dsh-repair-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  repair:
    name: dsh/review-repair
    runs-on: [self-hosted, agent-change]
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Address pull request repair with the configured change agent
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPAIR_REQUEST_ID: ${{ inputs.request_id }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          AGENT_ROLE: change
        run: node controller/src/dsh-repair.mjs
