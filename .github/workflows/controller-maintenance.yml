name: Controller Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '11-59/15 * * * *'

concurrency:
  group: controller-maintenance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  routing:
    name: maintenance/routing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the trusted maintenance replica route
        env:
          AGENT_REPLICA_ID: ${{ vars.AGENT_AUTOMATION_MAINTENANCE_REPLICA_ID }}
        shell: bash
        run: |
          if [[ ! "$AGENT_REPLICA_ID" =~ ^controller-[A-Za-z0-9_.-]+-maintenance$ ]]; then
            echo 'AGENT_AUTOMATION_MAINTENANCE_REPLICA_ID is missing or invalid.' >&2
            exit 1
          fi

  recover:
    name: maintenance/recover
    needs: routing
    runs-on: [self-hosted, "${{ vars.AGENT_AUTOMATION_MAINTENANCE_REPLICA_ID }}"]
    timeout-minutes: 120
    steps:
      - name: Check out the exact Controller revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: controller
          persist-credentials: false

      - name: Install locked production dependencies
        working-directory: controller
        run: npm ci --omit=dev --ignore-scripts

      - name: Advance at most one trusted transition per root fault
        env:
          CONTROLLER_REPOSITORY: ${{ github.repository }}
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_CHECKOUT: ${{ github.workspace }}/controller
          AGENT_REPLICA_ID: ${{ vars.AGENT_AUTOMATION_MAINTENANCE_REPLICA_ID }}
        run: node controller/src/maintenance-recovery.mjs
