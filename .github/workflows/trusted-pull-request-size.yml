name: Trusted pull request size

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: trusted-pull-request-size-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  trusted-pull-request-size:
    name: trusted pull request size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_CONTEXT: policy/pull-request-size
    steps:
      - name: Publish pending status
        env: { STATUS_STATE: pending }
        run: >-
          jq -cn --arg state "$STATUS_STATE" --arg target_url "$TARGET_URL" --arg context "$STATUS_CONTEXT" '{state:$state,target_url:$target_url,description:"Pull request size policy",context:$context}' | curl --fail --silent --show-error --request POST --url "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/statuses/$HEAD_SHA" --header "Authorization: Bearer $GITHUB_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' --data-binary @-
      - name: Check out the trusted pull request base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-controller
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request head for diff data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-diff
          fetch-depth: 0
          persist-credentials: false

      - name: Make the trusted base available to the diff repository
        working-directory: candidate-diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_REPOSITORY: ${{ github.workspace }}/trusted-controller
        run: git fetch --no-tags "$TRUSTED_REPOSITORY" "$BASE_SHA"

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install trusted controller dependencies
        working-directory: trusted-controller
        run: npm ci --ignore-scripts

      - name: Enforce trusted pull request size
        working-directory: trusted-controller
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GIT_DIFF_REPOSITORY: ${{ github.workspace }}/candidate-diff
        run: node scripts/check-pr-size.mjs
      - name: Publish final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >-
          STATE=failure; if [ "$JOB_STATUS" = success ]; then STATE=success; fi; jq -cn --arg state "$STATE" --arg target_url "$TARGET_URL" --arg context "$STATUS_CONTEXT" '{state:$state,target_url:$target_url,description:"Pull request size policy",context:$context}' | curl --fail --silent --show-error --request POST --url "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/statuses/$HEAD_SHA" --header "Authorization: Bearer $GITHUB_TOKEN" --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' --header 'X-GitHub-Api-Version: 2022-11-28' --data-binary @-
