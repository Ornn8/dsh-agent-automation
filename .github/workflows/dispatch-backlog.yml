name: Dispatch DSH Backlog

on:
  workflow_call:
    inputs:
      requested_issue_number:
        description: Exact Issue to re-read after a non-authoritative wake event; zero scans the ordinary backlog.
        required: false
        default: 0
        type: number
      capacity_resume:
        description: Run one self-hosted capacity-wait observation.
        required: false
        default: false
        type: boolean

concurrency:
  group: dsh-backlog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  capacity-resume:
    if: inputs.capacity_resume
    name: dsh/capacity-resume
    runs-on: [self-hosted, agent-change]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Evaluate current Issue capacity waits
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node controller/src/resume-capacity.mjs

  dispatch:
    name: dsh/backlog-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Dispatch one ready work item
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          TRUSTED_REVIEW_WORKFLOW_PATH: .github/workflows/agent-review.yml
          REQUESTED_ISSUE_NUMBER: ${{ inputs.requested_issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/dispatch-backlog.mjs
