name: Dispatch DSH Backlog

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      controller_sha:
        required: true
        type: string

concurrency:
  group: dsh-backlog-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dsh/backlog-dispatch
    runs-on: [self-hosted, Windows, X64, dsh-agent]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate immutable controller revision
        env:
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if ($env:CONTROLLER_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'controller_sha must be a full commit SHA'
          }

      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: ${{ inputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Dispatch one ready work item
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: node controller/src/dispatch-backlog.mjs
