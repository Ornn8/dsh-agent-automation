name: Dispatch DSH Backlog

on:
  workflow_call:

concurrency:
  group: dsh-backlog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dsh/backlog-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Dispatch one ready work item
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          TRUSTED_REVIEW_WORKFLOW_PATH: .github/workflows/agent-review.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/dispatch-backlog.mjs
