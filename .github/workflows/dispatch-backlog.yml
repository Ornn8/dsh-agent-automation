name: Dispatch DSH Backlog

on:
  workflow_call:
    inputs:
      requested_issue_number:
        description: Exact Issue to re-read after a non-authoritative wake event; zero scans the ordinary backlog.
        required: false
        default: 0
        type: number
      capacity_resume_only:
        description: Scan only controller-authored capacity-waiting projections for one bounded resume.
        required: false
        default: false
        type: boolean
      controller_login:
        description: Exact controller login that authored durable status projections.
        required: false
        default: ''
        type: string
    outputs:
      resume_type:
        description: Closed capacity-resume target type, or empty when no waiter is selected.
        value: ${{ jobs.dispatch.outputs.resume_type }}
      work_request:
        description: Exact validated WorkRequest JSON for the selected capacity waiter.
        value: ${{ jobs.dispatch.outputs.work_request }}
      capacity_resume_id:
        description: Exact capacity projection identity for the selected waiter.
        value: ${{ jobs.dispatch.outputs.capacity_resume_id }}
      pull_request_number:
        description: Exact pull request number for a repair waiter, or empty for an Issue.
        value: ${{ jobs.dispatch.outputs.pull_request_number }}
      head_sha:
        description: Exact selected subject head or Issue WorkRequest revision head.
        value: ${{ jobs.dispatch.outputs.head_sha }}
      resume_json:
        description: Bounded machine JSON for the selected capacity waiter.
        value: ${{ jobs.dispatch.outputs.resume_json }}

concurrency:
  group: dsh-backlog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dsh/backlog-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      resume_type: ${{ steps.dispatch.outputs.resume_type }}
      work_request: ${{ steps.dispatch.outputs.work_request }}
      capacity_resume_id: ${{ steps.dispatch.outputs.capacity_resume_id }}
      pull_request_number: ${{ steps.dispatch.outputs.pull_request_number }}
      head_sha: ${{ steps.dispatch.outputs.head_sha }}
      resume_json: ${{ steps.dispatch.outputs.resume_json }}
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Select one ready work item
        id: dispatch
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          TRUSTED_REVIEW_WORKFLOW_PATH: .github/workflows/agent-review.yml
          REQUESTED_ISSUE_NUMBER: ${{ inputs.requested_issue_number }}
          CAPACITY_RESUME_ONLY: ${{ inputs.capacity_resume_only }}
          TRUSTED_CONTROLLER_LOGIN: ${{ inputs.controller_login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/dispatch-backlog.mjs
