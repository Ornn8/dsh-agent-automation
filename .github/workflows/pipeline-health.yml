name: Agent Pipeline Health

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
      worker_id:
        required: true
        type: string
      runner_labels_json:
        required: true
        type: string

concurrency:
  group: agent-health-${{ inputs.repository }}-${{ inputs.worker_id }}
  cancel-in-progress: true

jobs:
  health:
    name: pipeline/health
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate immutable controller revision
        env:
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if ($env:CONTROLLER_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'controller_sha must be a full commit SHA'
          }

      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: ${{ inputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Verify the idle event bridge without model calls
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          AGENT_WORKER_ID: ${{ inputs.worker_id }}
        run: node controller/src/pipeline-health.mjs
