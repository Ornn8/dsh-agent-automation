name: Land Reviewed Pull Request

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull_request_number:
        required: false
        type: number
        default: 0
      head_sha:
        required: true
        type: string
      controller_sha:
        required: true
        type: string

concurrency:
  group: dsh-land-${{ inputs.repository }}-${{ inputs.pull_request_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  land:
    name: landing/exact-pair
    runs-on: [self-hosted, Windows, X64, dsh-agent]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate immutable controller revision
        env:
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: |
          if ($env:CONTROLLER_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'controller_sha must be a full commit SHA'
          }

      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: ${{ inputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Land only after exact review and required checks pass
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: node controller/src/land-pr.mjs
