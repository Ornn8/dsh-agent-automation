name: Land Reviewed Pull Request

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        type: number
        default: 0
      head_sha:
        required: true
        type: string

concurrency:
  group: dsh-land-${{ github.repository }}-${{ inputs.pull_request_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  land:
    name: landing/exact-pair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Land only after exact review and required checks pass
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          TRUSTED_REVIEW_WORKFLOW_PATH: .github/workflows/codex-review.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/land-pr.mjs
