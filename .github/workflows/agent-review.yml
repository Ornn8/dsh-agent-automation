name: Agent Review

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      profile_id:
        required: false
        type: string
        default: github-pr-cycle
      workflow_id:
        required: false
        type: string
        default: default
      stage_id:
        required: false
        type: string
        default: review
concurrency:
  group: agent-review-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  review:
    name: agent/review
    runs-on: [self-hosted, agent-reviewer]
    timeout-minutes: 255
    permissions:
      actions: read
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Review exact PR head with the configured Agent
        id: review
        continue-on-error: true
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PROFILE_ID: ${{ inputs.profile_id }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          STAGE_ID: ${{ inputs.stage_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/agent-review.mjs

      - name: Publish an independent change work request
        id: work_request
        if: steps.review.outcome == 'success' && steps.review.outputs.verdict == 'block'
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PROFILE_ID: ${{ inputs.profile_id }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          STAGE_ID: ${{ inputs.stage_id }}
          REVIEW_ROUTE: ${{ steps.review.outputs.review_route }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          GOVERNOR_WORKFLOW_PATH: .github/workflows/agent-review.yml
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/publish-work-request.mjs

      - name: Fail the exact-head review CheckRun when automation fails
        if: steps.review.outcome == 'failure'
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_CHECK_ID: ${{ steps.review.outputs.review_check_id }}
          REVIEW_FAILURE_CLASS: ${{ steps.review.outputs.failure_class }}
          REVIEW_FAILURE_CODE: ${{ steps.review.outputs.failure_code }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/review-failure.mjs

      - name: Preserve the blocking review conclusion
        if: steps.review.outputs.verdict == 'block'
        shell: pwsh
        run: throw 'The review Worker returned a BLOCK verdict'

      - name: Preserve reviewer infrastructure failure
        if: steps.review.outcome == 'failure'
        shell: pwsh
        run: throw 'Review infrastructure did not return a verdict'
