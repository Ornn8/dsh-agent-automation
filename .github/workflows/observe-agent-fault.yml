name: Observe Agent Infrastructure Fault

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string

concurrency:
  group: agent-fault-observation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    name: fault/observe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Observe one exact reviewer infrastructure failure
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          FAULT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/observe-agent-fault.mjs
