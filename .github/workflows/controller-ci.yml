name: Controller CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Run controller tests
        run: npm test
      - name: Run Windows operations tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-operations.ps1
      - name: Run target bootstrap tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-bootstrap-repository.ps1

  all-checks-passed:
    name: all checks passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every controller test job
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = success
