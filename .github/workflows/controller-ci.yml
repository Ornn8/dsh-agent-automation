name: Controller CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request-scope:
    name: pull request scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install controller dependencies for pull request scope
        if: github.event_name == 'pull_request'
        run: npm ci --ignore-scripts
      - name: Enforce reviewable pull request size
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-size.mjs
      - name: Skip the pull request gate for non-pull-request events
        if: github.event_name != 'pull_request'
        run: echo "Pull request size does not apply to this event."

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install controller development dependencies
        run: npm ci --ignore-scripts
      - name: Type-check GitHub policy data
        run: npm run typecheck
      - name: Run controller tests
        run: npm test
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run portable installation-plan tests
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-installation-plan.ps1
      - name: Run Windows operations tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test-operations.ps1
      - name: Run target bootstrap tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-bootstrap-repository.ps1

  all-checks-passed:
    name: all checks passed
    if: always()
    needs: [pull-request-scope, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every controller test job
        env:
          SCOPE_RESULT: ${{ needs.pull-request-scope.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$TEST_RESULT" = success
