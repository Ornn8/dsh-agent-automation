name: Reconcile Exact-Pair Reviews

on:
  workflow_call:

concurrency:
  group: dsh-review-reconcile-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: codex/reconcile-base
    runs-on: [self-hosted, agent-change]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Reconcile open pull requests after a base update
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRUSTED_CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_CONTROLLER_SHA: ${{ job.workflow_sha }}
          TRUSTED_REVIEW_WORKFLOW_PATH: .github/workflows/codex-review.yml
        run: node controller/src/reconcile-reviews.mjs
