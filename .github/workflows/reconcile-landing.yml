name: Reconcile Reviewed Pull Requests

on:
  workflow_call:
    inputs:
      profile_id:
        required: false
        type: string
        default: github-pr-cycle

concurrency:
  group: dsh-landing-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: landing/reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Reconcile trusted reviewed pull requests
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROFILE_ID: ${{ inputs.profile_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/reconcile-landing.mjs
