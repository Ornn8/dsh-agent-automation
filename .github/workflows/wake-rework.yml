name: Wake DSH For Rework

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull_request_number:
        required: true
        type: number
      comment_id:
        required: true
        type: number
      controller_sha:
        required: true
        type: string

concurrency:
  group: dsh-rework-${{ inputs.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  repair:
    name: dsh/comment-rework
    runs-on: [self-hosted, Windows, X64, dsh-agent]
    timeout-minutes: 210
    steps:
      - name: Check out automation controller
        uses: actions/checkout@v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: ${{ inputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Address explicit trusted rework comment
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node controller/src/wake-rework.mjs
