name: Wake DSH For Rework

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number
      comment_id:
        required: true
        type: number

concurrency:
  group: dsh-repair-${{ github.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  repair:
    name: automation/comment-admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Address explicit trusted rework comment
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node controller/src/wake-rework.mjs
