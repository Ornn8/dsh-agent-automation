name: DSH Issue Agent

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      request_id:
        required: true
        type: string

concurrency:
  group: dsh-issue-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    name: dsh/issue-agent
    runs-on: [self-hosted, agent-change]
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Execute Issue with DSH
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_REQUEST_ID: ${{ inputs.request_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          AGENT_ROLE: change
        run: node controller/src/dsh-issue.mjs
