name: DSH Issue Agent

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      issue_number:
        required: true
        type: number

concurrency:
  group: dsh-issue-${{ inputs.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    name: dsh/issue-agent
    runs-on: [self-hosted, Windows, X64, dsh-agent]
    timeout-minutes: 210
    steps:
      - name: Check out automation controller
        uses: actions/checkout@v6
        with:
          repository: Ornn8/dsh-agent-automation
          ref: master
          path: controller
          persist-credentials: false

      - name: Execute Issue with DSH
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node controller/src/dsh-issue.mjs
