name: DSH Issue Agent

on:
  workflow_call:
    inputs:
      work_request:
        required: true
        type: string
      route_decision:
        required: false
        type: string
        default: ''

concurrency:
  group: dsh-issue-${{ github.repository }}-${{ fromJSON(inputs.work_request).subject.number }}
  cancel-in-progress: false

jobs:
  execute:
    name: dsh/issue-agent
    runs-on: [self-hosted, agent-change]
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Check out automation controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Execute Issue with DSH
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          WORK_REQUEST_JSON: ${{ inputs.work_request }}
          ROUTE_DECISION_JSON: ${{ inputs.route_decision }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTROLLER_REPOSITORY: ${{ job.workflow_repository }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
        run: node controller/src/dsh-issue.mjs
