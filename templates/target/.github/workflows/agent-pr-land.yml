name: Agent PR Advancement

on:
  repository_dispatch:
    types: [dsh-land, dsh-advance]
  workflow_run:
    workflows: {{CI_WORKFLOW_NAMES_JSON}}
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  advance-pull-request:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_run'
        && contains(fromJSON(vars.DSH_AUTOMATION_CI_WORKFLOWS), github.event.workflow_run.name))
      || (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository)
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/advance-pr.yml@{{CONTROLLER_SHA}}
    with:
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.pull_request_number || github.event.client_payload.pr_number) || github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 0 }}
      base_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      profile_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.profile_id || 'github-pr-cycle' }}
      workflow_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.workflow_id || '' }}
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
