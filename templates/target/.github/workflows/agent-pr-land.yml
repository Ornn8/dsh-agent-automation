name: Agent PR Landing

on:
  repository_dispatch:
    types: [dsh-land]
  workflow_run:
    workflows: {{CI_WORKFLOW_NAMES_JSON}}
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  land-reviewed-pr:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_run'
        && contains(fromJSON(vars.DSH_AUTOMATION_CI_WORKFLOWS), github.event.workflow_run.name)
        && github.event.workflow_run.conclusion == 'success')
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/land-pr.yml@{{CONTROLLER_SHA}}
    with:
      pull_request_number: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || github.event.workflow_run.pull_requests[0].number || 0 }}
      head_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.workflow_run.head_sha }}
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
