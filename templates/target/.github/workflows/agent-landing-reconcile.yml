name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  backlog:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/dispatch-backlog.yml@{{CONTROLLER_SHA}}

  review-reconcile:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/reconcile-reviews.yml@{{CONTROLLER_SHA}}

  reconcile:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/reconcile-landing.yml@{{CONTROLLER_SHA}}
    with:
      profile_id: github-pr-cycle
