name: Agent Landing Reconcile

on:
  workflow_dispatch:
  schedule:
    - cron: '8-59/15 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

jobs:
  reconcile:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/reconcile-landing.yml@{{CONTROLLER_SHA}}
    with:
      required_checks_json: ${{ vars.DSH_AUTOMATION_REQUIRED_CHECKS }}
