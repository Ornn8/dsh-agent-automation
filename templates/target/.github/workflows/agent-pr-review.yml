name: Agent PR Review
run-name: >-
  Agent PR Review #${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pull_request_number || github.event.pull_request.number }}
  ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_sha || github.event.pull_request.base.sha }}..${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha }}
  profile:${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.profile_id || 'github-pr-cycle') || 'github-pr-cycle' }} request:${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.request_id || 'legacy') || github.run_id }}

on:
  repository_dispatch:
    types: [agent-review]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-pr-review-${{ github.repository }}-${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.request_id || github.run_id) || github.run_id }}
  cancel-in-progress: false

jobs:
  agent-review:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/agent-review.yml@{{CONTROLLER_SHA}}
    with:
      pull_request_number: ${{ github.event.client_payload.pull_request_number }}
      base_sha: ${{ github.event.client_payload.base_sha }}
      head_sha: ${{ github.event.client_payload.head_sha }}
      profile_id: ${{ github.event.client_payload.profile_id || 'github-pr-cycle' }}
      workflow_id: ${{ github.event.client_payload.workflow_id || 'default' }}
      stage_id: ${{ github.event.client_payload.stage_id || 'review' }}
      worker_route_decision: ${{ github.event.client_payload.worker_route_decision || '' }}
