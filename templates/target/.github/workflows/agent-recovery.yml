name: Agent Recovery

on:
  workflow_run:
    workflows: [Agent Issues, Agent PR Rework, Agent PR CI Repair, Agent PR Review]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  observe:
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/observe-agent-fault.yml@{{CONTROLLER_SHA}}
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
      source_run_attempt: ${{ github.event.workflow_run.run_attempt }}

  recover:
    needs: observe
    if: always()
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/recover-backlog.yml@{{CONTROLLER_SHA}}
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
      controller_login: ${{ vars.AGENT_AUTOMATION_CONTROLLER_LOGIN }}
