name: Agent Recovery

on:
  workflow_run:
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.name != github.workflow
    uses: {{CONTROLLER_REPOSITORY}}/.github/workflows/recover-backlog.yml@{{CONTROLLER_SHA}}
    with:
      source_run_id: ${{ github.event.workflow_run.id }}
